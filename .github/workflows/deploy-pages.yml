name: Build and approve TFDA Pages

on:
  workflow_run:
    workflows: ["Refresh TFDA data state"]
    types: [completed]
  workflow_dispatch:
    inputs:
      app_ref:
        description: "要發布的程式 branch、tag 或完整 commit SHA；回滾時填上一個正常 commit"
        required: true
        default: "main"
        type: string
      data_ref:
        description: "要發布的 data-state branch 或完整 commit SHA；回滾時填上一個正常 commit"
        required: true
        default: "data-state"
        type: string

permissions:
  contents: read

concurrency:
  group: tfda-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      auto_deploy: ${{ steps.policy.outputs.auto_deploy }}
      site_path: ${{ steps.release.outputs.site_path }}
      release_id: ${{ steps.release.outputs.release_id }}
      app_sha: ${{ steps.revisions.outputs.app_sha }}
      data_sha: ${{ steps.revisions.outputs.data_sha }}
    steps:
      - name: Check out deployment policy from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy

      - name: Download successful scheduled refresh provenance
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          gh run download "$REFRESH_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name scheduled-refresh-revisions --dir "${{ runner.temp }}/refresh-provenance"

      - name: Select immutable refresh commits or manual refs
        id: refs
        run: >-
          python3 policy/tools/pipeline/deploy_policy.py
          --event "$GITHUB_EVENT_PATH"
          --provenance "${{ runner.temp }}/refresh-provenance/refresh-revisions.json"
          >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.refs.outputs.app_ref }}
          path: app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.refs.outputs.data_ref }}
          path: state

      - name: Resolve selected refs to immutable commits
        id: revisions
        run: |
          echo "app_sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "data_sha=$(git -C state rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read last approved app from the current data-state head
        working-directory: state
        run: |
          git fetch origin data-state
          if git cat-file -e FETCH_HEAD:approved-app.json; then
            git show FETCH_HEAD:approved-app.json > "${{ runner.temp }}/approved-app.json"
          fi

      - name: Choose reviewed or automatic deployment
        id: policy
        env:
          APP_SHA: ${{ steps.revisions.outputs.app_sha }}
          DATA_SHA: ${{ steps.revisions.outputs.data_sha }}
        run: >-
          python3 policy/tools/pipeline/deploy_policy.py
          --event "$GITHUB_EVENT_PATH"
          --provenance "${{ runner.temp }}/refresh-provenance/refresh-revisions.json"
          --approved-record "${{ runner.temp }}/approved-app.json"
          --app-sha "$APP_SHA" --data-sha "$DATA_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and verify application
        working-directory: app
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npm run prepare:e2e
          npm run test:e2e

      - name: Revalidate the selected data-state commit
        run: >-
          python3 app/tools/pipeline/state_manifest.py
          --official-dir state/official/current
          --structured-dir state/structured
          --require-incremental
          --allow-initial-building
          --max-incremental-lag-days 14
          --max-official-snapshot-age-days 14
          --output "${{ runner.temp }}/verified-data-state.json"

      - name: Build candidate release with integrity gates
        id: release
        env:
          APP_SHA: ${{ steps.revisions.outputs.app_sha }}
          DATA_SHA: ${{ steps.revisions.outputs.data_sha }}
        run: |
          RELEASE_ID="${APP_SHA:0:12}-${DATA_SHA:0:12}-${GITHUB_RUN_ID}"
          python3 app/tools/pipeline/static_release.py \
            --release-id "$RELEASE_ID" \
            --release-root candidate \
            --source-dir state/official/current/raw \
            --source-manifest state/official/current/manifest.json \
            --structured-dir state/structured/documents \
            --app-revision "$APP_SHA" \
            --data-revision "$DATA_SHA" \
            --max-official-snapshot-age-days 14
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "site_path=$GITHUB_WORKSPACE/candidate/releases/$RELEASE_ID/site" >> "$GITHUB_OUTPUT"
          echo "audit_path=$GITHUB_WORKSPACE/candidate/releases/$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Verify publication evidence and visible attribution
        run: >-
          python3 app/tools/pipeline/release_preflight.py
          --policy app/config/publication-policy.json
          --site-root "${{ steps.release.outputs.site_path }}"
          --project-root app
          --output "${{ runner.temp }}/publication-preflight.json"

      - name: Build the supervisor approval summary
        run: >-
          python3 app/tools/pipeline/approval_summary.py
          --manifest "${{ steps.release.outputs.audit_path }}/manifest.json"
          --coverage "${{ steps.release.outputs.audit_path }}/coverage.json"
          --data-state "${{ runner.temp }}/verified-data-state.json"
          --preflight "${{ runner.temp }}/publication-preflight.json"
          --synonyms "${{ steps.release.outputs.site_path }}/data/synonyms.json"
          --output "${{ runner.temp }}/approval-summary.md"
          --max-age-days 14
          --max-lag-days 14

      - name: Show the supervisor summary before approval
        run: cat "${{ runner.temp }}/approval-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload small audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit-${{ github.run_id }}
          path: |
            ${{ steps.release.outputs.audit_path }}/manifest.json
            ${{ steps.release.outputs.audit_path }}/coverage.json
            ${{ steps.release.outputs.site_path }}/data/synonyms.json
            ${{ runner.temp }}/publication-preflight.json
            ${{ runner.temp }}/verified-data-state.json
            ${{ runner.temp }}/approval-summary.md
          retention-days: 30

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload candidate Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.release.outputs.site_path }}

  approval-lock:
    if: vars.SUPERVISOR_APPROVAL_CONFIGURED != 'true' || vars.PUBLICATION_AUTHORIZED != 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '拒絕部署：必須有主管 required reviewer，且專案負責人已明確授權公開發布。'
          echo '確認後才可設定 SUPERVISOR_APPROVAL_CONFIGURED=true 與 PUBLICATION_AUTHORIZED=true。'
          exit 1

  deploy:
    if: vars.SUPERVISOR_APPROVAL_CONFIGURED == 'true' && vars.PUBLICATION_AUTHORIZED == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ needs.build.outputs.auto_deploy == 'true' && 'github-pages-auto' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy through the selected environment policy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-test:
    needs: [build, deploy]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.app_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install deployment verifier
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Open the deployed site and search one real catalog license
        run: >-
          node scripts/verify-deployed.mjs
          --url "${{ needs.deploy.outputs.page_url }}"
          --expected-release-id "${{ needs.build.outputs.release_id }}"
          --expected-app-sha "${{ needs.build.outputs.app_sha }}"
          --expected-data-sha "${{ needs.build.outputs.data_sha }}"
          --output "${{ runner.temp }}/deployment-smoke.json"

      - name: Preserve deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment-smoke.json
          if-no-files-found: warn
          retention-days: 30

  record-approved-app:
    if: needs.build.outputs.auto_deploy == 'false'
    needs: [build, deploy, smoke-test]
    permissions:
      contents: write
    concurrency:
      group: tfda-data-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data-state

      - name: Record app approval only after reviewed deployment and successful smoke
        env:
          APPROVED_APP_SHA: ${{ needs.build.outputs.app_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          app_sha = os.environ['APPROVED_APP_SHA']
          assert re.fullmatch(r'[a-f0-9]{40}', app_sha)
          Path('approved-app.json').write_text(json.dumps({
              'schema_version': 1,
              'app_sha': app_sha,
              'environment': 'github-pages',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'deployment_run_id': os.environ['GITHUB_RUN_ID'],
              'deployment_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add approved-app.json
          git commit -m "data: record reviewed app approval run $GITHUB_RUN_ID"
          git push origin HEAD:data-state
