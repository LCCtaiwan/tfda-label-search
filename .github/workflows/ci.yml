name: Verify TFDA label search

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Install browser used by end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run prepare:e2e
      - run: npm run test:e2e
      - name: Build fixture site
        run: >-
          npm run build --
          --input tests/fixtures/pagefind-search-sample.json
          --input tests/fixtures/structured-real-sample.json
          --output site
